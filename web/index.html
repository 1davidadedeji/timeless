<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Timeless</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="wrap">
    <header class="top top-row">
      <div>
        <h1>Timeless</h1>
        <p class="sub" id="status">Loading…</p>
      </div>
      <div class="theme-wrap">
        <button type="button" class="theme-toggle" id="theme-toggle">Theme</button>
        <div class="theme-box" id="theme-box">
          <p class="sub" id="theme-hex">#c4a35a</p>
          <label>R <input type="range" id="theme-r" min="0" max="255" /></label>
          <label>G <input type="range" id="theme-g" min="0" max="255" /></label>
          <label>B <input type="range" id="theme-b" min="0" max="255" /></label>
          <label><input type="checkbox" id="theme-tint" /> Full tint</label>
          <button type="button" class="ghost" id="theme-reset">Reset</button>
        </div>
      </div>
    </header>
    <main class="flow">
      <div class="band band-year">
        <section class="card compact">
          <h2>Year</h2>
          <details class="fold" open>
            <summary>Activity</summary>
            <div id="heat"></div>
          </details>
        </section>
        <section class="card compact">
          <h2>Plan</h2>
          <div id="plan"></div>
        </section>
      </div>
      <section class="card">
        <h2>Events</h2>
        <div class="scroll" id="meetings"></div>
      </section>
      <section class="card">
        <h2>Approvals</h2>
        <div class="scroll" id="approvals"></div>
      </section>
      <div class="band band-prog">
        <section class="card">
          <h2>Programs</h2>
          <div class="scroll" id="opps"></div>
        </section>
        <section class="card compact">
          <h2>Rituals</h2>
          <div id="rituals"></div>
        </section>
      </div>
      <div class="band">
        <section class="card">
          <h2>Mail</h2>
          <div class="scroll" id="mail"></div>
        </section>
        <section class="card">
          <h2>Sensors</h2>
          <div class="row phone-bar">
            <button type="button" id="ph-w">Wireless</button>
            <button type="button" class="ghost" id="ph-u">USB</button>
          </div>
          <p class="sub" id="phone-msg">Reconnect the phone when this Mac is on its hotspot, or with USB.</p>
          <div class="scroll" id="heart"></div>
        </section>
      </div>
    </main>
  </div>
  <div class="fab" id="fab">
    <div class="fab-panel chat">
      <div class="chat-head">
        <span>Timeless</span>
        <button type="button" class="ghost chat-clear" id="chat-clear">Clear</button>
      </div>
      <div id="log" class="chat-log"></div>
      <div class="chat-hints" id="hints">
        <button type="button" class="hint" data-q="What did I do today?">Today</button>
        <button type="button" class="hint" data-q="open leetcode">LeetCode</button>
        <button type="button" class="hint" data-q="What's on my calendar?">Calendar</button>
      </div>
      <div class="row">
        <input id="q" placeholder="Ask or tell me to do something…" autocomplete="off" />
        <button type="button" id="ask">Send</button>
      </div>
    </div>
    <button type="button" class="fab-btn" id="fab-toggle" aria-label="Chat">+</button>
  </div>
  <script src="/static/theme.js"></script>
  <script src="/static/app.js"></script>
  <script src="/static/clock.js"></script>
  <script>
    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function ago(iso) {
      if (!iso) return "never";
      const t = Date.parse(iso.endsWith("Z") ? iso : iso + "Z");
      if (Number.isNaN(t)) return iso;
      const s = Math.max(0, (Date.now() - t) / 1000);
      if (s < 60) return "just now";
      if (s < 3600) return Math.round(s / 60) + "m ago";
      if (s < 86400) return Math.round(s / 3600) + "h ago";
      return Math.round(s / 86400) + "d ago";
    }
    function when(iso) {
      if (!iso) return "";
      const d = new Date(iso.endsWith("Z") ? iso : iso + "Z");
      if (Number.isNaN(d.getTime())) return iso;
      return d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
    }
    function snippet(payload) {
      if (!payload || typeof payload !== "object") return "";
      return Object.entries(payload)
        .filter(([, v]) => v != null && v !== "")
        .slice(0, 3)
        .map(([k, v]) => `${k.replace(/_/g, " ")} ${String(v).slice(0, 72)}`)
        .join(" · ");
    }
    let lastMain = "";
    let lastSide = "";
    let lastToday = null;
    let planDay = "";
    let viewPlanCache = { day: "", plan: null };
    function editing() {
      if (document.querySelector(".clock-pop")) return true;
      const a = document.activeElement;
      return a && ["INPUT", "TEXTAREA", "SELECT"].includes(a.tagName) && a.id !== "q";
    }
    function blockHtml(b) {
      return `<div class="block-row" data-block>
        <div><label>Start</label><button type="button" class="time-btn" data-k="start">${esc(b.start || "09:00")}</button></div>
        <div><label>End</label><button type="button" class="time-btn" data-k="end">${esc(b.end || "10:00")}</button></div>
        <input class="task" data-k="task" placeholder="What you'll do" value="${esc(b.task || "")}" />
      </div>`;
    }
    function paintMain(t) {
      lastToday = t;
      if (!planDay) planDay = t.day;
      const plan = (planDay === t.day ? (t.plan || {}) : (t.viewPlan || {}));
      const blocks = (plan.timeline && plan.timeline.length)
        ? plan.timeline.map(blockHtml).join("")
        : blockHtml({ start: "09:00", end: "10:00", task: "" });
      el("plan").innerHTML = `<label>Day</label>
        <input type="date" id="plan-day" value="${esc(planDay)}" min="${esc(t.day)}" />
        <label>What done means</label>
        <textarea id="outcomes">${esc(plan.outcomes || "")}</textarea>
        <details class="fold" open>
          <summary>Time blocks</summary>
          <div id="plan-rows">${blocks}</div>
          <div class="row">
            <button type="button" class="ghost" id="add-block">Add block</button>
            <button type="button" id="save-plan">Save plan</button>
          </div>
        </details>`;
      el("meetings").innerHTML = t.meetings.length
        ? `<table class="grid-table"><thead><tr><th>When</th><th>Title</th><th>Type</th><th>Join</th></tr></thead><tbody>` +
          t.meetings.map((m) => `<tr>
            <td>${esc(when(m.start_at))}</td>
            <td>${esc(m.title)}</td>
            <td><select data-meet="${m.id}" data-k="modality">
              <option value="virtual"${m.modality === "virtual" ? " selected" : ""}>Virtual</option>
              <option value="physical"${m.modality === "physical" ? " selected" : ""}>In person</option>
            </select></td>
            <td>${m.join_url ? `<a href="${esc(m.join_url)}" target="_blank" rel="noopener">Join</a>` : ""}
              <input data-meet="${m.id}" data-k="join_url" placeholder="paste link" value="${esc(m.join_url || "")}" /></td>
          </tr>`).join("") + `</tbody></table>`
        : "<p>No events stored.</p>";
      el("opps").innerHTML = t.opportunities.length
        ? `<table class="grid-table"><thead><tr><th>Role</th><th>Kind</th><th>State</th><th>URL</th></tr></thead><tbody>` +
          t.opportunities.map((o) => `<tr>
            <td><input data-opp-edit="${o.id}" data-k="role" value="${esc(o.role || "")}" /></td>
            <td><select data-opp-edit="${o.id}" data-k="kind">
              ${["internship","hackathon","conference","other"].map((k) =>
                `<option${o.kind === k ? " selected" : ""}>${k}</option>`).join("")}
            </select></td>
            <td><select data-opp="${o.id}" data-state-sel="1">
              ${["seen","applied","shortlisted","interview","waiting","offer","rejected","skipped","ignored"].map((s) =>
                `<option${o.state === s ? " selected" : ""}>${s}</option>`).join("")}
            </select></td>
            <td><input data-opp-edit="${o.id}" data-k="url" value="${esc(o.url || "")}" /></td>
          </tr>`).join("") + `</tbody></table><p class="sub">Change a field and it saves.</p>`
        : "<p>No postings yet.</p>";
      el("approvals").innerHTML = t.approvals.length
        ? t.approvals.map((a) => `<div class="item"><span class="chip">${esc(a.kind.replace(/_/g, " "))}</span>
            <p>${esc(snippet(a.payload))}</p>
            <div class="row">
              <button data-id="${a.id}" data-act="accept">Accept</button>
              <button class="ghost" data-id="${a.id}" data-act="keep">Keep seen</button>
              <button class="ghost" data-id="${a.id}" data-act="reject">Ignore</button>
            </div></div>`).join("")
        : "<p>None pending.</p>";
      el("mail").innerHTML = t.mail.length
        ? `<table class="grid-table"><thead><tr><th>Type</th><th>Subject</th></tr></thead><tbody>` +
          t.mail.map((m) => `<tr><td><span class="chip">${esc(m.classification)}</span></td><td>${esc(m.subject)}</td></tr>`).join("") +
          `</tbody></table>`
        : "<p>No actionable mail cards.</p>";
      el("rituals").innerHTML = t.rituals.length
        ? t.rituals.map((r) => `<div class="row"><span>${esc(r.name)}</span>
            ${r.launch_url ? `<a href="${esc(r.launch_url)}" target="_blank">Open</a>` : ""}
            <button data-done="${r.id}">Done</button></div>`).join("")
        : "<p>No rituals pinned.</p>";
    }
    async function paintSide(t) {
      const heat = (t.heatmap || []).map((d) => {
        const n = d.count || 0;
        const lvl = n === 0 ? 0 : n < 3 ? 1 : n < 8 ? 2 : n < 20 ? 3 : 4;
        return `<span class="cell" title="${esc(d.day)}: ${n}" data-lvl="${lvl}"></span>`;
      }).join("");
      el("heat").innerHTML = `<div class="heat">${heat}</div>`;
      el("heart").innerHTML = t.heartbeats.length
        ? `<div class="sensors">` +
          t.heartbeats.map((h) => {
            const stale = (Date.now() - Date.parse((h.last_seen || "").endsWith("Z") ? h.last_seen : h.last_seen + "Z")) > 30 * 60 * 1000;
            const detail = (h.detail || "").slice(0, 120);
            return `<div class="sensor">
              <div class="sensor-top">
                <span class="sensor-name">${esc(h.sensor)}</span>
                <span class="chip ${stale ? "stale" : "ok"}">${stale ? "stale" : "ok"}</span>
              </div>
              <p class="sensor-meta">${esc(ago(h.last_seen))}${detail ? " · " + esc(detail) : ""}</p>
            </div>`;
          }).join("") + `</div>`
        : "<p>No sensors yet.</p>";
      try {
        const a = await api("/api/access");
        const remote = (a.urls || []).filter((u) => !u.includes("127.0.0.1"));
        if (remote.length) {
          el("heart").innerHTML += "<p class=\"sub\">Phone (LAN/Tailscale)</p><ul>" +
            remote.map((u) => `<li><code>${esc(u)}</code></li>`).join("") + "</ul>";
        }
      } catch (_) {}
    }
    async function refresh(opts) {
      const nav = opts && opts.nav;
      const force = opts && opts.force;
      const t = await api("/api/today");
      if (planDay && planDay !== t.day) {
        if (viewPlanCache.day !== planDay) {
          viewPlanCache = { day: planDay, plan: await api("/api/plan?day=" + encodeURIComponent(planDay)) };
        }
        t.viewPlan = viewPlanCache.plan;
      } else if (planDay === t.day) {
        t.viewPlan = t.plan;
      }
      if (nav) {
        if (t.halt) { location.href = "/halt"; return; }
        if (t.needs_recap) { location.href = "/recap"; return; }
        if (t.needs_gate) { location.href = "/gate"; return; }
      }
      el("status").textContent = t.brain === "online"
        ? `Brain online · ${t.day} ${t.tz}`
        : "Brain offline";
      if (editing() && !force) return;
      const main = JSON.stringify({
        plan: t.plan, meetings: t.meetings, opps: t.opportunities,
        approvals: t.approvals, mail: t.mail, rituals: t.rituals, planDay,
      });
      const side = JSON.stringify({ heat: t.heatmap, heart: t.heartbeats });
      if (force || main !== lastMain) {
        lastMain = main;
        paintMain(t);
      }
      if (force || side !== lastSide) {
        lastSide = side;
        await paintSide(t);
      }
    }

    function collectTimeline() {
      return [...document.querySelectorAll("#plan-rows [data-block]")].map((row) => ({
        start: row.querySelector("[data-k=start]").textContent.trim(),
        end: row.querySelector("[data-k=end]").textContent.trim(),
        task: row.querySelector("[data-k=task]").value,
      })).filter((b) => b.task.trim());
    }
    async function savePlan() {
      const outcomes = el("outcomes").value;
      const day = el("plan-day").value || planDay;
      const timeline = collectTimeline();
      await api("/api/plan", { method: "POST", body: JSON.stringify({ outcomes, timeline, day }) });
      planDay = day;
      viewPlanCache = { day: "", plan: null };
      await refresh({ force: true });
    }

    document.body.addEventListener("click", async (e) => {
      const t = e.target;
      if (t.id === "save-plan") await savePlan();
      if (t.id === "add-block") {
        el("plan-rows").insertAdjacentHTML("beforeend", blockHtml({ start: "09:00", end: "10:00", task: "" }));
      }
      if (t.classList && t.classList.contains("time-btn")) {
        ClockPop(t, t.textContent.trim(), (v) => { t.textContent = v; });
      }
      if (t.dataset.act && t.dataset.id) {
        await api(`/api/approvals/${t.dataset.id}/${t.dataset.act}`, { method: "POST" });
        await refresh({ force: true });
      }
      if (t.dataset.done) {
        const out = await api(`/api/rituals/${t.dataset.done}/done`, { method: "POST" });
        alert(out.praise);
        await refresh({ force: true });
      }
    });
    document.body.addEventListener("change", async (e) => {
      const t = e.target;
      if (t.id === "plan-day") {
        planDay = t.value;
        viewPlanCache = { day: planDay, plan: await api("/api/plan?day=" + encodeURIComponent(planDay)) };
        if (lastToday) {
          lastToday.viewPlan = viewPlanCache.plan;
          lastMain = "";
          paintMain(lastToday);
        }
        return;
      }
      if (t.dataset.meet && t.dataset.k) {
        const body = {};
        body[t.dataset.k] = t.value;
        await api(`/api/meetings/${t.dataset.meet}`, { method: "PATCH", body: JSON.stringify(body) });
        await refresh({ force: true });
      }
      if (t.dataset.opp && t.dataset.stateSel) {
        await api(`/api/opportunities/${t.dataset.opp}/state`, { method: "POST", body: JSON.stringify({ state: t.value }) });
        await refresh({ force: true });
      }
      if (t.dataset.oppEdit && t.dataset.k) {
        const body = {};
        body[t.dataset.k] = t.value;
        await api(`/api/opportunities/${t.dataset.oppEdit}`, { method: "PATCH", body: JSON.stringify(body) });
        await refresh({ force: true });
      }
    });

    el("fab-toggle").onclick = () => el("fab").classList.toggle("open");
    const chatKey = "timeless_chat";
    let thread = [];
    try { thread = JSON.parse(localStorage.getItem(chatKey) || "[]"); } catch (_) { thread = []; }
    function renderChat() {
      if (!thread.length) {
        el("log").innerHTML = `<div class="bubble bot">Hey. Ask about the day, or tell me to open something, add an event, or update the plan.</div>`;
        return;
      }
      el("log").innerHTML = thread.map((m) =>
        `<div class="bubble ${m.role === "user" ? "you" : "bot"}">${esc(m.content)}</div>`
      ).join("");
      el("log").scrollTop = el("log").scrollHeight;
    }
    function saveChat() {
      localStorage.setItem(chatKey, JSON.stringify(thread.slice(-40)));
    }
    async function sendChat(message) {
      message = (message || "").trim();
      if (!message) return;
      thread.push({ role: "user", content: message });
      renderChat();
      el("log").insertAdjacentHTML("beforeend", `<div class="bubble bot busy" id="typing">…</div>`);
      el("log").scrollTop = el("log").scrollHeight;
      el("q").value = "";
      el("ask").disabled = true;
      try {
        const history = thread.slice(0, -1).map((m) => ({
          role: m.role === "user" ? "user" : "assistant",
          content: m.content,
        }));
        const r = await api("/api/chat", { method: "POST", body: JSON.stringify({ message, history }) });
        const reply = (r.offline ? "(offline) " : "") + (r.reply || "");
        thread.push({ role: "assistant", content: reply });
        saveChat();
      } catch (err) {
        thread.push({ role: "assistant", content: err.message || "Could not reach the brain." });
      }
      el("ask").disabled = false;
      renderChat();
      await refresh({ force: true });
    }
    renderChat();
    el("ask").onclick = () => sendChat(el("q").value);
    el("q").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendChat(el("q").value);
      }
    });
    el("chat-clear").onclick = () => { thread = []; saveChat(); renderChat(); };
    document.body.addEventListener("click", (e) => {
      if (e.target.classList && e.target.classList.contains("hint")) sendChat(e.target.dataset.q);
    });
    async function phoneLink(mode) {
      const msg = el("phone-msg");
      msg.textContent = mode === "usb" ? "Looking for USB…" : "Trying wireless (hotspot / saved IP)…";
      try {
        const r = await api("/api/phone/connect", { method: "POST", body: JSON.stringify({ mode }) });
        msg.textContent = r.ok
          ? `Linked (${mode}): ${(r.devices || []).join(", ") || "ok"}`
          : (r.detail || "Phone not reachable. Skip recap still uses Mac data.");
      } catch (err) {
        msg.textContent = err.message || "Connect failed.";
      }
      await refresh({ force: true });
    }
    el("ph-w").onclick = () => phoneLink("wireless");
    el("ph-u").onclick = () => phoneLink("usb");

    refresh({ nav: true }).catch((err) => { el("status").textContent = "Brain offline — " + err.message; });
    setInterval(() => refresh().catch(() => {}), 8000);
  </script>
</body>
</html>

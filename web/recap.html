<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Timeless recap</title>
  <style>
    html, body { margin: 0; height: 100%; background: var(--bg, #070707); color: #f3ead8; font-family: "Arial Narrow", "Helvetica Neue", sans-serif; }
    .stage { min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px; overflow: auto; }
    .ticket {
      position: relative; z-index: 1;
      width: min(340px, 92vw); min-height: 420px; border: 1px solid var(--accent, #c4a35a); padding: 28px 24px 22px;
      display: flex; flex-direction: column; box-shadow: 0 0 0 8px var(--bg, #070707), 0 0 0 9px color-mix(in srgb, var(--accent, #c4a35a) 14%, transparent);
    }
    .k { font-size: 11px; letter-spacing: .42em; text-transform: uppercase; color: var(--accent, #c4a35a); }
    h1 { font-weight: 400; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; margin: 36px 0 8px; }
    .stat { font-size: 72px; line-height: .9; font-weight: 700; margin: 8px 0 20px; letter-spacing: -.04em; }
    .bar { height: 1px; background: linear-gradient(90deg, var(--accent, #c4a35a), transparent); margin: 0 0 16px; }
    p { margin: 0; color: #b9b09a; font-size: 15px; line-height: 1.4; flex: 1; overflow-wrap: anywhere; }
    button {
      margin-top: 24px; background: var(--accent, #c4a35a); color: #100c06; border: 0; padding: 12px 16px;
      font: inherit; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; cursor: pointer;
    }
    .dots { display: flex; gap: 6px; margin-bottom: 18px; }
    .dots i { width: 6px; height: 6px; border-radius: 50%; background: #333; display: block; }
    .dots i.on { background: var(--accent, #c4a35a); }
  </style>
</head>
<body>
  <div class="stage">
    <div class="ticket" id="card">
      <div class="dots" id="dots"></div>
      <div class="k" id="kicker">Admit one</div>
      <h1 id="title">Loading</h1>
      <div class="stat" id="stat">—</div>
      <div class="bar"></div>
      <p id="body">Pulling the day, including the phone if it will answer.</p>
      <button type="button" id="go">Next</button>
    </div>
  </div>
  <script src="/static/theme.js"></script>
  <script src="/static/app.js"></script>
  <script>
    let cards = [];
    let i = 0;
    function paint() {
      const c = cards[i] || {};
      el("kicker").textContent = c.kicker || "Admit one";
      el("title").textContent = c.title || "";
      el("stat").textContent = c.stat || "—";
      el("body").textContent = c.body || "";
      el("go").textContent = i >= cards.length - 1 ? "I saw this" : "Next";
      el("dots").innerHTML = cards.map((_, n) => `<i class="${n===i?"on":""}"></i>`).join("");
      el("go").style.display = cards.length ? "block" : "none";
    }
    function phoneStep() {
      el("dots").innerHTML = "";
      el("kicker").textContent = "Phone";
      el("title").textContent = "Reconnect";
      el("stat").textContent = "ADB";
      el("body").textContent = "Wireless if this Mac is on the phone hotspot (or the saved Wi-Fi IP). USB if the cable is plugged in. Skip uses Mac data only.";
      el("go").style.display = "none";
      let actions = document.getElementById("phone-actions");
      if (!actions) {
        actions = document.createElement("div");
        actions.id = "phone-actions";
        actions.innerHTML = `<button type="button" id="ph-w">Wireless</button>
          <button type="button" id="ph-u">USB</button>
          <button type="button" id="ph-s" style="background:transparent;color:#f3ead8;border:1px solid #c4a35a;margin-top:8px">Skip</button>
          <p id="ph-msg" style="margin-top:12px;font-size:13px"></p>`;
        el("card").appendChild(actions);
        const msg = () => document.getElementById("ph-msg");
        const run = async (body) => {
          msg().textContent = "Working…";
          const r = await api("/api/recap/generate", { method: "POST", body: JSON.stringify(body) });
          msg().textContent = (r.phone && r.phone.detail) || (r.phone_synced ? "Phone synced." : "Mac-only recap.");
          cards = r.cards || [];
          i = 0;
          actions.remove();
          paint();
        };
        document.getElementById("ph-w").onclick = () => run({ skip_phone: false, mode: "wireless" });
        document.getElementById("ph-u").onclick = () => run({ skip_phone: false, mode: "usb" });
        document.getElementById("ph-s").onclick = () => run({ skip_phone: true });
      }
    }
    el("go").onclick = async () => {
      if (i >= cards.length - 1) {
        await api("/api/recap/ack", { method: "POST" });
        location.href = "/";
        return;
      }
      i += 1;
      paint();
    };
    (async () => {
      const t = await api("/api/today");
      if (t.halt) { location.href = "/halt"; return; }
      if (!t.needs_recap) { location.href = t.needs_gate ? "/gate" : "/"; return; }
      const existing = t.recap && t.recap.cards;
      if (existing && existing.length && t.recap.phone_synced) {
        cards = existing;
        paint();
        return;
      }
      phoneStep();
    })().catch((err) => { el("body").textContent = err.message; });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Timeless recap</title>
  <style>
    html, body { margin: 0; height: 100%; background: #070707; color: #f3ead8; font-family: "Arial Narrow", "Helvetica Neue", sans-serif; }
    .stage { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .ticket {
      width: min(340px, 92vw); min-height: 420px; border: 1px solid #c4a35a; padding: 28px 24px 22px;
      display: flex; flex-direction: column; box-shadow: 0 0 0 8px #070707, 0 0 0 9px #c4a35a22;
    }
    .k { font-size: 11px; letter-spacing: .42em; text-transform: uppercase; color: #c4a35a; }
    h1 { font-weight: 400; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; margin: 36px 0 8px; }
    .stat { font-size: 72px; line-height: .9; font-weight: 700; margin: 8px 0 20px; letter-spacing: -.04em; }
    .bar { height: 1px; background: linear-gradient(90deg, #c4a35a, transparent); margin: 0 0 16px; }
    p { margin: 0; color: #b9b09a; font-size: 15px; line-height: 1.4; flex: 1; }
    button {
      margin-top: 24px; background: #c4a35a; color: #100c06; border: 0; padding: 12px 16px;
      font: inherit; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; cursor: pointer;
    }
    .dots { display: flex; gap: 6px; margin-bottom: 18px; }
    .dots i { width: 6px; height: 6px; border-radius: 50%; background: #333; display: block; }
    .dots i.on { background: #c4a35a; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="ticket" id="card">
      <div class="dots" id="dots"></div>
      <div class="k" id="kicker">Admit one</div>
      <h1 id="title">Loading</h1>
      <div class="stat" id="stat">—</div>
      <div class="bar"></div>
      <p id="body">Pulling the day, including the phone if it will answer.</p>
      <button type="button" id="go">Next</button>
    </div>
  </div>
  <script src="/static/app.js"></script>
  <script>
    let cards = [];
    let i = 0;
    function paint() {
      const c = cards[i] || {};
      el("kicker").textContent = c.kicker || "Admit one";
      el("title").textContent = c.title || "";
      el("stat").textContent = c.stat || "—";
      el("body").textContent = c.body || "";
      el("go").textContent = i >= cards.length - 1 ? "I saw this" : "Next";
      el("dots").innerHTML = cards.map((_, n) => `<i class="${n===i?"on":""}"></i>`).join("");
    }
    el("go").onclick = async () => {
      if (i >= cards.length - 1) {
        await api("/api/recap/ack", { method: "POST" });
        location.href = "/";
        return;
      }
      i += 1;
      paint();
    };
    (async () => {
      const t = await api("/api/today");
      if (t.halt) { location.href = "/halt"; return; }
      if (!t.needs_recap) { location.href = t.needs_gate ? "/gate" : "/"; return; }
      cards = (t.recap && t.recap.cards) || [];
      if (!cards.length) cards = [{ kicker: "Admit one", title: "Empty house", stat: "0", body: "No events stored for this Chicago day." }];
      paint();
    })().catch((err) => { el("body").textContent = err.message; });
  </script>
</body>
</html>
